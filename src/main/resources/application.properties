spring.application.name=restaurante
server.port=8080

# --- PostgreSQL (datos del restaurante) ---
# Los valores por defecto coinciden con docker-compose.yml; se pueden
# sobreescribir con variables de entorno sin tocar este archivo.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/sushicraft_db}
spring.datasource.username=${DB_USER:sushicraft}
spring.datasource.password=${DB_PASSWORD:sushicraft123}

# update: Hibernate crea/ajusta las tablas a partir de las entidades.
# El esquema equivalente en SQL esta documentado en docs/sql/esquema.sql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- MongoDB (historial de cambios de los pedidos) ---
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27018/sushicraft_historial}

# --- Seguridad JWT ---
# Clave en Base64 (minimo 256 bits para HS256). Solo para desarrollo:
# en un despliegue real se pasa por la variable de entorno JWT_SECRET.
seguridad.jwt.secreto=${JWT_SECRET:S2F6ZU5vcmlTdXNoaUNyYWZ0RE9TVzIwMjYtMi1TYW50aWFnb0dhcmNpYQ==}
seguridad.jwt.expiracion-ms=${JWT_EXPIRACION_MS:7200000}

# --- Reglas del restaurante ---
restaurante.parqueadero.cupos=15
restaurante.reservas.margen-horas=2
