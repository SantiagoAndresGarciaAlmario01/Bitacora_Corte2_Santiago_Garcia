# Perfil "docker": se activa con SPRING_PROFILES_ACTIVE=docker (ver docker-compose.yml).
# Reemplaza "localhost" por los nombres de los servicios dentro de la red de docker compose,
# y toma las credenciales de las variables de entorno en vez de tenerlas quemadas.
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sushicraft}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:mongo}:${MONGO_PORT:27017}/${MONGO_DB:sushicraft}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
