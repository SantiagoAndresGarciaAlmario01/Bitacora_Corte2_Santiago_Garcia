name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/restaurante-api

jobs:

  build-test:
    name: Build y pruebas
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sushicraft
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sushicraft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilar y correr pruebas (mvn clean verify)
        run: mvn -B clean verify

  docker-build-push:
    name: Build y push de la imagen a Docker Hub
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}

  deploy-qa:
    name: Deploy a Azure App Service - QA
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment:
      name: qa
      url: https://restaurante-qa-kevinsg-f8cze3ecckd8cjdx.eastus-01.azurewebsites.net

    steps:
      - name: Deploy del contenedor a QA
        uses: azure/webapps-deploy@v3
        with:
          app-name: restaurante-qa-kevinsg
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_QA }}
          images: docker.io/${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}

  deploy-prod:
    name: Deploy a Azure App Service - PROD (requiere aprobacion manual)
    needs: deploy-qa
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment:
      name: production
      url: https://restaurante-prod-kevinsg-amandrh7csf7gfaz.eastus-01.azurewebsites.net

    steps:
      - name: Deploy del contenedor a PROD
        uses: azure/webapps-deploy@v3
        with:
          app-name: restaurante-prod-kevinsg
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          images: docker.io/${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}
